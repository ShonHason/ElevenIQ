[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleveniq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    # Style-map PCA and the export (plan 006 W1, ADR 005 §1; ADR 004 §13.5 anticipated this).
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    # Web contract validation (ADR 005 §2): the exporter validates every file against
    # contract/v1/*.schema.json; tests validate the fixture and a full export.
    "jsonschema>=4.18",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eleveniq*"]

[tool.setuptools.package-data]
"eleveniq.analytics" = ["measurements/*.json"]  # registry measurements (ADR 004 §10)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires pipeline output in data/interim/ (slow, loads event JSON files)",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
