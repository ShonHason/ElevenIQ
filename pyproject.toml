[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleveniq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    # Spikes only for now (ADR 004 §13.5): style-map PCA (M4g1), seeded RNG. They become
    # runtime dependencies when src/ first imports them (M4g5, the xPass stage).
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eleveniq*"]

[tool.setuptools.package-data]
"eleveniq.analytics" = ["measurements/*.json"]  # registry measurements (ADR 004 §10)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires pipeline output in data/interim/ (slow, loads event JSON files)",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
