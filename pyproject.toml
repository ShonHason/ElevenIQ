[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleveniq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eleveniq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires pipeline output in data/interim/ (slow, loads event JSON files)",
]
